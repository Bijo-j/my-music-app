<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1e2e 0%, #121212 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 20px; color: #b388ff; }
  .player {
    background: #1e1e2e;
    border-radius: 20px;
    padding: 30px 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .art {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, #b388ff, #7c4dff);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    margin-bottom: 20px;
  }
  .song-title {
    font-size: 18px;
    text-align: center;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .controls button {
    background: #b388ff;
    border: none;
    color: #121212;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .controls button:active { transform: scale(0.9); }
  .controls button.play { width: 70px; height: 70px; font-size: 30px; }
  input[type="file"] { display: none; }
  .upload-btn {
    display: block;
    text-align: center;
    background: #2a2a3e;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    color: #b388ff;
    border: 1px dashed #b388ff;
  }
  .upload-btn:active { background: #3a3a4e; }
</style>
</head>
<body>
  <h1>🎵 My Music Player</h1>
  <div class="player">
    <div class="art">🎧</div>
    <div class="song-title" id="title">No song loaded</div>
    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button class="play" id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="next()">⏭</button>
    </div>
    <label class="upload-btn" for="fileInput">
      📁 Add Music Files (MP3)
    </label>
    <input type="file" id="fileInput" accept="audio/*" multiple>
  </div>

  <script>
    const input = document.getElementById('fileInput');
    const titleEl = document.getElementById('title');
    const playBtn = document.getElementById('playBtn');
    let songs = [];
    let currentIndex = 0;
    const audio = new Audio();

    input.addEventListener('change', (e) => {
      songs = Array.from(e.target.files);
      if (songs.length > 0) {
        currentIndex = 0;
        loadSong(currentIndex);
        play();
      }
    });

    function loadSong(index) {
      if (songs.length === 0) return;
      audio.src = URL.createObjectURL(songs[index]);
      titleEl.textContent = songs[index].name.replace(/\.[^/.]+$/, "");
    }

    function play() {
      if (songs.length === 0) { alert('Add some MP3 files first!'); return; }
      audio.play();
      playBtn.textContent = '⏸';
    }

    function togglePlay() {
      if (songs.length === 0) { alert('Add some MP3 files first!'); return; }
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '⏸';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    }

    function next() {
      if (songs.length === 0) return;
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong(currentIndex);
      play();
    }

    function prev() {
      if (songs.length === 0) return;
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      loadSong(currentIndex);
      play();
    }

    audio.addEventListener('ended', next);
  </script>
</body>
</html>
