<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Music · ad-free streaming</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #121212; --bg2: #181818; --bg3: #282828;
    --green: #1DB954; --text: #ffffff; --light: #a7a7a7;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden; padding-bottom: 120px;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }

  .header {
    position: sticky; top: 0; background: rgba(18,18,18,0.95);
    backdrop-filter: blur(20px); z-index: 100; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .logo { font-size: 18px; font-weight: 800; color: var(--green); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .logo::before { content: '🎵'; font-size: 22px; }
  .search { flex: 1; position: relative; }
  .search input {
    width: 100%; background: var(--bg3); border: none; outline: none;
    color: var(--text); padding: 10px 16px 10px 40px; border-radius: 24px;
    font-size: 14px; font-family: inherit;
  }
  .search input::placeholder { color: var(--light); }
  .search::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }

  .content { padding: 20px 16px; }
  .section { margin-bottom: 32px; }
  .section-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; letter-spacing: -0.3px; }
  .section-sub { font-size: 13px; color: var(--light); margin-top: -12px; margin-bottom: 16px; }

  .genres { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; flex-wrap: wrap; }
  .genres::-webkit-scrollbar { display: none; }
  .genre-chip {
    flex-shrink: 0; padding: 8px 18px; background: var(--bg3); border: none;
    color: var(--text); border-radius: 20px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .genre-chip:hover { background: #3e3e3e; }
  .genre-chip.active { background: var(--green); color: #000; font-weight: 700; }

  .track-list { display: flex; flex-direction: column; gap: 4px; }
  .track-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
  .track-row:hover { background: var(--bg3); }
  .track-row.playing { background: rgba(29,185,84,0.1); }
  .track-row-art { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: var(--bg3); }
  .track-row-info { flex: 1; min-width: 0; }
  .track-row-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .track-row.playing .track-row-title { color: var(--green); }
  .track-row-artist { font-size: 12px; color: var(--light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .load-more {
    text-align: center; margin-top: 16px; padding: 12px;
    background: var(--bg3); border: none; border-radius: 30px;
    color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer;
    transition: background 0.2s; font-family: inherit; letter-spacing: 0.5px;
    width: 100%;
  }
  .load-more:hover { background: #3e3e3e; }
  .load-more:disabled { opacity: 0.5; pointer-events: none; }

  .player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, #181818, #0d0d0d);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px; z-index: 200; display: none;
  }
  .player.show { display: block; }
  .progress-wrap { width: 100%; height: 4px; background: #4d4d4d; border-radius: 4px; margin-bottom: 10px; position: relative; cursor: pointer; }
  .progress-wrap:hover { height: 6px; }
  .progress-bar { height: 100%; background: var(--green); border-radius: 4px; width: 0%; transition: width 0.1s linear; position: relative; }
  .progress-bar::after { content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: white; border-radius: 50%; opacity: 0; transition: opacity 0.15s; }
  .progress-wrap:hover .progress-bar::after { opacity: 1; }
  .player-main { display: flex; align-items: center; gap: 12px; }
  .player-art { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: var(--bg3); }
  .player-info { flex: 1; min-width: 0; }
  .player-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-artist { font-size: 11px; color: var(--light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .player-controls { display: flex; align-items: center; gap: 6px; }
  .pc-btn { background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; font-family: inherit; }
  .pc-btn:active { transform: scale(0.9); }
  .pc-btn.play { background: white; color: #000; width: 38px; height: 38px; border-radius: 50%; font-size: 14px; padding-left: 3px; }
  .pc-btn.on { color: var(--green); }
  .player-time { display: none; font-size: 11px; color: var(--light); font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; }
  @media (min-width: 500px) { .player-time { display: block; } }

  .loading { text-align: center; padding: 60px 20px; color: var(--light); }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--bg3); border-top-color: var(--green); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px 20px; color: var(--light); }
  .empty::before { content: '🎧'; font-size: 60px; display: block; margin-bottom: 16px; opacity: 0.5; }
  .toast { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--green); color: #000; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 300; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 500px) {
    .logo { font-size: 14px; } .logo::before { font-size: 18px; }
    .section-title { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">My Music</div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search songs, artists...">
  </div>
</div>

<div class="content" id="content">
  <div class="section">
    <div class="section-title">Browse Genres</div>
    <div class="genres" id="genreList"></div>
  </div>
  <div class="section">
    <div class="section-title" id="tracksTitle">🔥 Trending Now</div>
    <div class="section-sub" id="tracksSub">Popular tracks</div>
    <div id="tracksArea" class="track-list"></div>
  </div>
</div>

<div class="player" id="player">
  <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="player-main">
    <img class="player-art" id="playerArt" src="" alt="">
    <div class="player-info">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-artist" id="playerArtist">—</div>
    </div>
    <div class="player-controls">
      <button class="pc-btn" id="shuffleBtn">🔀</button>
      <button class="pc-btn" id="prevBtn">⏮</button>
      <button class="pc-btn play" id="playBtn">▶</button>
      <button class="pc-btn" id="nextBtn">⏭</button>
      <button class="pc-btn" id="repeatBtn">🔁</button>
    </div>
    <div class="player-time" id="playerTime">0:00 / 0:00</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ══════════════════════════════════════════════════════════
  // CONFIG — iTunes Search API (100% CORS-friendly, no key needed)
  // ══════════════════════════════════════════════════════════
  const JAMENDO_CLIENT_ID = '6509f2f9';
  const JAMENDO_API = 'https://api.jamendo.com/v3.0';
  const ITUNES_API = 'https://itunes.apple.com';

  // ══════════════════════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════════════════════
  let tracks = [];
  let currentIndex = -1;
  let currentGenre = '';
  let currentSource = 'jamendo';
  let shuffleOn = false;
  let repeatOn = false;
  let currentSearch = '';
  let isLoading = false;
  let itunesPage = 0;
  let jamendoOffset = 0;
  let lastQueryIndex = -1;

  const audio = new Audio();
  audio.preload = 'auto';

  const GENRES = [
    { label: '🔥 Trending', value: '', source: 'jamendo' },
    { label: 'Pop', value: 'pop', source: 'jamendo' },
    { label: 'Rock', value: 'rock', source: 'jamendo' },
    { label: 'Jazz', value: 'jazz', source: 'jamendo' },
    { label: 'Electronic', value: 'electronic', source: 'jamendo' },
    { label: 'Hip-Hop', value: 'hiphop', source: 'jamendo' },
    { label: 'Classical', value: 'classical', source: 'jamendo' },
    { label: '🇮🇳 All Indian', value: 'indian-all', source: 'itunes' },
    { label: '🌴 Malayalam', value: 'malayalam', source: 'itunes' },
    { label: '🎬 Tamil', value: 'tamil', source: 'itunes' },
    { label: '🎵 Hindi', value: 'hindi', source: 'itunes' },
    { label: '🎭 Telugu', value: 'telugu', source: 'itunes' },
  ];

  const el = {
    genreList: document.getElementById('genreList'),
    tracksTitle: document.getElementById('tracksTitle'),
    tracksSub: document.getElementById('tracksSub'),
    tracksArea: document.getElementById('tracksArea'),
    searchInput: document.getElementById('searchInput'),
    player: document.getElementById('player'),
    playerArt: document.getElementById('playerArt'),
    playerTitle: document.getElementById('playerTitle'),
    playerArtist: document.getElementById('playerArtist'),
    playerTime: document.getElementById('playerTime'),
    progressWrap: document.getElementById('progressWrap'),
    progressBar: document.getElementById('progressBar'),
    playBtn: document.getElementById('playBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    shuffleBtn: document.getElementById('shuffleBtn'),
    repeatBtn: document.getElementById('repeatBtn'),
    toast: document.getElementById('toast'),
  };

  function showToast(msg, ms = 2000) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(el.toast._t);
    el.toast._t = setTimeout(() => el.toast.classList.remove('show'), ms);
  }
  function fmtTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function placeholderArt() {
    return "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1DB954"/><stop offset="100%" stop-color="#0d5c2a"/></linearGradient></defs><rect fill="url(#g)" width="200" height="200"/><text x="100" y="125" font-size="80" text-anchor="middle">🎵</text></svg>'
    );
  }

  function renderGenres() {
    el.genreList.innerHTML = GENRES.map(g =>
      `<button class="genre-chip ${g.value === currentGenre && !currentSearch ? 'active' : ''}" data-genre="${g.value}" data-source="${g.source}">${g.label}</button>`
    ).join('');
    el.genreList.querySelectorAll('.genre-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        currentGenre = btn.dataset.genre;
        currentSource = btn.dataset.source;
        currentSearch = '';
        el.searchInput.value = '';
        itunesPage = 0;
        jamendoOffset = 0;
        lastQueryIndex = -1;
        tracks = [];
        renderGenres();
        loadTracks(true);
      });
    });
  }

  async function loadTracks(reset = true) {
    if (isLoading) return;
    isLoading = true;

    if (reset) {
      itunesPage = 0;
      jamendoOffset = 0;
      lastQueryIndex = -1;
      tracks = [];
      currentIndex = -1;
      el.tracksArea.className = 'track-list';
      el.tracksArea.innerHTML = '<div class="loading"><div class="spinner"></div>Loading music…</div>';
    }

    try {
      if (currentSource === 'itunes') {
        await loadItunes(reset);
      } else {
        await loadJamendo(reset);
      }
    } catch (err) {
      console.error(err);
      el.tracksArea.innerHTML = `<div class="empty">Could not load music.<br><small style="opacity:.6;">${esc(err.message)}</small></div>`;
    } finally {
      isLoading = false;
      const btn = el.tracksArea.querySelector('.load-more');
      if (btn) { btn.textContent = '⬇ Load more songs'; btn.disabled = false; }
    }
  }

  // ══════════════════════════════════════════════════════════
  // ITUNES LOADER — reliable, CORS-friendly, huge Indian catalog
  // Uses 30-second preview MP3s (legal, free, ad-free)
  // ══════════════════════════════════════════════════════════
  async function loadItunes(reset) {
    const LIMIT = 50; // iTunes allows up to 200

    // Query sets per language for variety + no repetition
    const queriesMap = {
      'indian-all': [
        'bollywood hits', 'arijit singh', 'shreya ghoshal', 'ar rahman',
        'lata mangeshkar', 'kishore kumar', 'sonu nigam', 'indian classical'
      ],
      'malayalam': [
        'malayalam hits', 'kj yesudas', 'mg sreekumar', 'malayalam melody',
        'ks chithra malayalam', 'vidyasagar malayalam', 'malayalam film songs'
      ],
      'tamil': [
        'tamil hits', 'ar rahman tamil', 'ilaiyaraaja', 'anirudh ravichander',
        'sp balasubrahmanyam', 'tamil melody', 'tamil film songs'
      ],
      'hindi': [
        'hindi hits', 'bollywood', 'arijit singh', 'lata mangeshkar',
        'kishore kumar hindi', 'shreya ghoshal hindi', 'bollywood classics'
      ],
      'telugu': [
        'telugu hits', 'ss thaman', 'devi sri prasad', 'sid sriram',
        'telugu melody', 'telugu film songs', 'keeravani'
      ],
    };

    let queries;
    if (currentSearch) {
      el.tracksTitle.textContent = `🔍 "${currentSearch}"`;
      el.tracksSub.textContent = 'Search results';
      queries = [currentSearch];
    } else {
      const info = queriesMap[currentGenre] || queriesMap['indian-all'];
      const labelMap = {
        'indian-all': '🇮🇳 All Indian Music',
        'malayalam': '🌴 Malayalam Songs',
        'tamil': '🎬 Tamil Songs',
        'hindi': '🎵 Hindi Songs',
        'telugu': '🎭 Telugu Songs',
      };
      el.tracksTitle.textContent = labelMap[currentGenre] || '🇮🇳 Indian Music';
      el.tracksSub.textContent = 'Popular tracks';
      queries = info;
    }

    // Cycle through queries on each load so we get different artists each time
    lastQueryIndex = (lastQueryIndex + 1) % queries.length;
    const query = queries[lastQueryIndex];

    // iTunes search: entity=song gives tracks with previewUrl
    const url = `${ITUNES_API}/search?term=${encodeURIComponent(query)}&entity=song&limit=${LIMIT}&offset=${itunesPage * LIMIT}`;

    const res = await fetch(url);
    if (!res.ok) throw new Error('iTunes API returned ' + res.status);
    const json = await res.json();

    const results = json.results || [];
    itunesPage++;

    const existingIds = new Set(tracks.map(t => t.id));
    const seenKeys = new Set(tracks.map(t => (t.title + '|' + t.artist).toLowerCase()));

    const newTracks = [];
    results.forEach(song => {
      if (!song.previewUrl) return;                    // only playable tracks
      const id = 'it_' + song.trackId;
      if (!id || existingIds.has(id)) return;

      const title = song.trackName || '';
      const artist = song.artistName || 'Unknown';
      const art = (song.artworkUrl100 || '').replace('100x100bb', '300x300bb');

      const key = (title + '|' + artist).toLowerCase();
      if (seenKeys.has(key)) return;

      existingIds.add(id);
      seenKeys.add(key);

      newTracks.push({
        id,
        title,
        artist,
        art,
        audio: song.previewUrl,
        duration: Math.round((song.trackTimeMillis || 30000) / 1000),
      });
    });

    tracks = tracks.concat(newTracks);

    if (!tracks.length) {
      el.tracksArea.innerHTML = '<div class="empty">No songs found. Try another search or genre.</div>';
      return;
    }
    renderTracks();
  }

  // ══════════════════════════════════════════════════════════
  // JAMENDO LOADER
  // ══════════════════════════════════════════════════════════
  async function loadJamendo(reset) {
    const LIMIT = 30;
    let url = `${JAMENDO_API}/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=${LIMIT}&offset=${jamendoOffset}&include=musicinfo&audioformat=mp32&order=popularity_total`;

    if (currentSearch) {
      url += `&search=${encodeURIComponent(currentSearch)}`;
      el.tracksTitle.textContent = `🔍 "${currentSearch}"`;
      el.tracksSub.textContent = 'Search results (Jamendo)';
    } else if (currentGenre) {
      url += `&tags=${encodeURIComponent(currentGenre)}`;
      const g = GENRES.find(x => x.value === currentGenre);
      el.tracksTitle.textContent = `${g ? g.label : currentGenre}`;
      el.tracksSub.textContent = 'Popular in this genre';
    } else {
      el.tracksTitle.textContent = '🔥 Trending Now';
      el.tracksSub.textContent = 'Popular tracks on Jamendo';
    }

    const res = await fetch(url);
    const data = await res.json();
    if (data.headers.status !== 'success') throw new Error(data.headers.error_message || 'API error');

    const newTracks = (data.results || []).map(t => ({
      id: t.id,
      title: t.name,
      artist: t.artist_name,
      art: t.image || t.album_image || '',
      audio: t.audio,
      duration: parseInt(t.duration) || 0,
    })).filter(t => t.audio);

    const existingIds = new Set(tracks.map(t => t.id));
    const filtered = newTracks.filter(t => !existingIds.has(t.id));
    tracks = tracks.concat(filtered);

    jamendoOffset += LIMIT;

    if (!tracks.length) {
      el.tracksArea.innerHTML = '<div class="empty">No tracks found.</div>';
      return;
    }
    renderTracks();
  }

  function renderTracks() {
    if (!tracks.length) {
      el.tracksArea.innerHTML = '<div class="empty">No tracks found.</div>';
      return;
    }

    el.tracksArea.className = 'track-list';
    let html = tracks.map((t, i) => `
      <div class="track-row ${i === currentIndex ? 'playing' : ''}" data-idx="${i}">
        <img class="track-row-art" src="${esc(t.art) || placeholderArt()}" onerror="this.src='${placeholderArt()}'" alt="">
        <div class="track-row-info">
          <div class="track-row-title">${esc(t.title)}</div>
          <div class="track-row-artist">${esc(t.artist)}</div>
        </div>
      </div>
    `).join('');

    html += `<button class="load-more" id="loadMoreBtn">⬇ Load more songs</button>`;
    el.tracksArea.innerHTML = html;

    el.tracksArea.querySelectorAll('.track-row[data-idx]').forEach(item => {
      item.addEventListener('click', () => playTrack(parseInt(item.dataset.idx)));
    });

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (loadMoreBtn) {
      loadMoreBtn.addEventListener('click', () => {
        if (isLoading) return;
        loadMoreBtn.textContent = 'Loading…';
        loadMoreBtn.disabled = true;
        loadTracks(false);
      });
    }
  }

  function playTrack(idx) {
    if (idx < 0 || idx >= tracks.length) return;
    currentIndex = idx;
    const t = tracks[idx];

    audio.src = t.audio;
    audio.play().catch(() => showToast('⚠️ Could not play'));

    el.player.classList.add('show');
    el.playerArt.src = t.art || placeholderArt();
    el.playerTitle.textContent = t.title;
    el.playerArtist.textContent = t.artist;

    renderTracks();
    updatePlayButton();
  }

  function togglePlay() {
    if (!audio.src) {
      if (tracks.length) playTrack(0);
      return;
    }
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  }

  function nextTrack() {
    if (!tracks.length) return;
    if (shuffleOn) playTrack(Math.floor(Math.random() * tracks.length));
    else playTrack((currentIndex + 1) % tracks.length);
  }

  function prevTrack() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    playTrack((currentIndex - 1 + tracks.length) % tracks.length);
  }

  function updatePlayButton() {
    el.playBtn.textContent = audio.paused ? '▶' : '⏸';
  }

  audio.addEventListener('play', updatePlayButton);
  audio.addEventListener('pause', updatePlayButton);
  audio.addEventListener('ended', () => {
    if (repeatOn) { audio.currentTime = 0; audio.play(); }
    else nextTrack();
  });
  audio.addEventListener('error', () => showToast('⚠️ Playback error'));
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const pct = (audio.currentTime / audio.duration) * 100;
      el.progressBar.style.width = pct + '%';
      el.playerTime.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
    }
  });
  audio.addEventListener('loadedmetadata', () => {
    el.playerTime.textContent = `0:00 / ${fmtTime(audio.duration)}`;
  });

  el.playBtn.addEventListener('click', togglePlay);
  el.nextBtn.addEventListener('click', nextTrack);
  el.prevBtn.addEventListener('click', prevTrack);
  el.shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    el.shuffleBtn.classList.toggle('on', shuffleOn);
    showToast(shuffleOn ? '🔀 Shuffle on' : 'Shuffle off');
  });
  el.repeatBtn.addEventListener('click', () => {
    repeatOn = !repeatOn;
    el.repeatBtn.classList.toggle('on', repeatOn);
    showToast(repeatOn ? '🔁 Repeat on' : 'Repeat off');
  });

  el.progressWrap.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = el.progressWrap.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  let searchTimer;
  el.searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = el.searchInput.value.trim();
      if (q.length >= 2 || q.length === 0) {
        currentSearch = q;
        if (q) {
          currentGenre = '';
          currentSource = 'itunes';    // search uses iTunes (huge catalog, CORS-friendly)
          renderGenres();
        } else {
          currentSource = 'jamendo';
          currentGenre = '';
          renderGenres();
        }
        itunesPage = 0;
        jamendoOffset = 0;
        lastQueryIndex = -1;
        tracks = [];
        loadTracks(true);
      }
    }, 500);
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
  });

  renderGenres();
  loadTracks(true);
</script>
</body>
</html>
