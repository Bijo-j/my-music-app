name: Build APK from HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create cordova-app com.bijoj.musicapp MyMusicApp
          cp index.html cordova-app/www/index.html
          cd cordova-app
          cordova platform add android

      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMusicApp-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/*.apk
